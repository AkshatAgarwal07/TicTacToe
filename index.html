<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacToe Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h3><u>TicTacToe Game</u></h3>
    
    <div id="game-container">
    

    <div id="player1">Player 1's turn</div>


    <div id="game-board">
        <div class="cell" id="cell-0"></div>
        <div class="cell" id="cell-1"></div>
        <div class="cell" id="cell-2"></div>
        <div class="cell" id="cell-3"></div>    
        <div class="cell" id="cell-4"></div>
        <div class="cell" id="cell-5"></div>
        <div class="cell" id="cell-6"></div>
        <div class="cell" id="cell-7"></div>
        <div class="cell" id="cell-8"></div>
    </div>
    
    <div id="player2">Player 2's turn</div></div>
    <div id="kk"><div id="result">Who's the WINNER..!</div></div>
    <div id="reset-container"><button id="resetBtn">Reset Game</button></div>
  
    <script src="script.js"></script>
</body>
</html>
